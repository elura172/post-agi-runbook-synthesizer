[project]
name = "post-agi-runbook-synthesizer"
version = "0.1.0"
description = "Automated SRE incident-to-runbook compiler, synthetic canary generator, and alerting synthesizer for distributed AI infrastructure"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
runbook = "post_agi_runbook_synthesizer.cli:main"
post-agi-runbook = "post_agi_runbook_synthesizer.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]
